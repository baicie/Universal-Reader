<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f8fa" />
  <title>Universal Reader</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#all" aria-label="Universal Reader 首页">
        <span class="brand-mark" aria-hidden="true">UR</span>
        <span class="brand-name">Universal Reader</span>
      </a>
      <div class="topbar-actions">
        <label class="search-box" for="search-input">
          <span aria-hidden="true">⌕</span>
          <input id="search-input" type="search" placeholder="搜索书名、作者或格式" autocomplete="off" />
          <kbd>⌘ K</kbd>
        </label>
        <button class="icon-button" id="settings-button" aria-label="打开设置" title="设置">⚙</button>
        <div class="avatar" aria-label="本地资料库">L</div>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar" aria-label="资料库导航">
        <div class="sidebar-heading">
          <span>Library</span>
          <button class="icon-button small" id="collapse-button" aria-label="收起侧栏" title="收起侧栏">‹</button>
        </div>
        <nav class="nav-list">
          <a class="nav-item active" href="#all" data-filter="all"><span class="nav-icon">▦</span><span>全部</span><span class="nav-count">12</span></a>
          <a class="nav-item" href="#recent" data-filter="recent"><span class="nav-icon">◷</span><span>最近阅读</span></a>
          <a class="nav-item" href="#reading" data-filter="reading"><span class="nav-icon">◉</span><span>正在阅读</span><span class="nav-count">3</span></a>
          <a class="nav-item" href="#favorites" data-filter="favorites"><span class="nav-icon">♡</span><span>收藏</span></a>
        </nav>
        <div class="sidebar-section">
          <div class="section-label"><span>Collections</span><button class="add-button" aria-label="新建集合" title="新建集合">+</button></div>
          <a class="collection-item" href="#collection"><span class="collection-dot amber"></span>设计与灵感<span class="nav-count">4</span></a>
          <a class="collection-item" href="#collection"><span class="collection-dot blue"></span>技术阅读<span class="nav-count">5</span></a>
          <a class="collection-item" href="#collection"><span class="collection-dot green"></span>小说<span class="nav-count">3</span></a>
        </div>
        <div class="sidebar-footer">
          <button class="secondary-button" id="import-folder"><span>＋</span> 导入文件夹</button>
          <p>Local-first · 离线可用</p>
        </div>
      </aside>

      <main class="main-content">
        <section class="page-header">
          <div>
            <p class="eyebrow">YOUR LIBRARY</p>
            <h1 id="page-title">全部书籍</h1>
            <p class="subtitle" id="page-subtitle">12 本书籍 · 最近同步于刚刚</p>
          </div>
          <div class="header-actions">
            <div class="view-toggle" role="group" aria-label="视图切换">
              <button class="view-button active" data-view="grid" aria-label="网格视图">⊞</button>
              <button class="view-button" data-view="list" aria-label="列表视图">☷</button>
            </div>
            <button class="primary-button" id="import-button"><span>＋</span> 导入书籍</button>
          </div>
        </section>

        <section class="continue-reading" aria-labelledby="continue-title">
          <div class="continue-copy">
            <p class="eyebrow">CONTINUE READING</p>
            <h2 id="continue-title">设计中的设计</h2>
            <p>原研哉 <span class="dot-separator">·</span> 第 4 章：白</p>
            <div class="progress-row"><div class="progress-track"><span style="width: 37%"></span></div><strong>37%</strong><span>还剩约 2 小时</span></div>
            <button class="text-button" id="continue-button">继续阅读 <span>→</span></button>
          </div>
          <div class="continue-cover cover-design"><span>设计<br/>中的<br/>设计</span><small>原研哉</small></div>
          <div class="continue-decoration" aria-hidden="true">04</div>
        </section>

        <div class="content-toolbar">
          <div class="filter-tabs" role="tablist" aria-label="书籍筛选">
            <button class="filter-tab active" data-type="all">全部 <span>12</span></button>
            <button class="filter-tab" data-type="reflow">可重排 <span>8</span></button>
            <button class="filter-tab" data-type="fixed">固定版式 <span>2</span></button>
            <button class="filter-tab" data-type="comic">漫画 <span>2</span></button>
          </div>
          <label class="sort-control">排序 <select id="sort-select"><option value="recent">最近添加</option><option value="title">标题</option><option value="progress">阅读进度</option></select></label>
        </div>

        <section class="book-grid" id="book-grid" aria-live="polite"></section>
        <section class="empty-state hidden" id="empty-state"><div class="empty-icon">⌕</div><h2>没有找到匹配的书籍</h2><p>尝试更换搜索词或筛选条件。</p><button class="secondary-button" id="clear-search">清除筛选</button></section>
      </main>
    </div>
  </div>
  <input id="file-input" type="file" multiple hidden accept=".epub,.pdf,.mobi,.azw3,.fb2,.txt,.md,.html,.cbz,.cbr" />
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
