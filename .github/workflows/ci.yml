name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    name: Flutter quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test with coverage
        run: flutter test --coverage

      - name: Coverage gate
        run: dart run tool/check_coverage.dart 70

      - name: Build Web
        run: flutter build web --release

  rust-quality:
    name: Rust service quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build server
        run: cargo build --workspace --release

  native-android:
    name: Android native core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Android native libraries
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o target/android/jniLibs build -p universal-reader-mobile --release

      - name: Verify ABI outputs
        run: test -f target/android/jniLibs/arm64-v8a/libuniversal_reader_native.so && test -f target/android/jniLibs/armeabi-v7a/libuniversal_reader_native.so && test -f target/android/jniLibs/x86_64/libuniversal_reader_native.so

      - name: Report ABI sizes
        run: du -h target/android/jniLibs/*/*.so

      - name: Upload Android native libraries
        uses: actions/upload-artifact@v4
        with:
          name: universal-reader-native-android
          path: rust/target/android/jniLibs

  native-ios:
    name: iOS native core
    runs-on: macos-14
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build iOS XCFramework
        run: bash tool/build-mobile-ios.sh

      - name: Verify XCFramework
        run: test -d target/ios/UniversalReaderNative.xcframework

      - name: Report XCFramework size
        run: du -sh target/ios/UniversalReaderNative.xcframework

      - name: Upload iOS XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: universal-reader-native-ios
          path: rust/target/ios/UniversalReaderNative.xcframework

  flutter-android:
    name: Android build
    runs-on: ubuntu-latest
    needs: native-android
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Download Android native libraries
        uses: actions/download-artifact@v4
        with:
          name: universal-reader-native-android
          path: rust/target/android/jniLibs

      - name: Verify Android native libraries
        working-directory: rust
        run: |
          test -f target/android/jniLibs/arm64-v8a/libuniversal_reader_native.so
          test -f target/android/jniLibs/armeabi-v7a/libuniversal_reader_native.so
          test -f target/android/jniLibs/x86_64/libuniversal_reader_native.so

      - name: Build Android APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify Android APK packaging
        run: |
          unzip -l build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -q 'lib/arm64-v8a/libuniversal_reader_native.so'
          unzip -l build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk | grep -q 'lib/armeabi-v7a/libuniversal_reader_native.so'
          unzip -l build/app/outputs/flutter-apk/app-x86_64-release.apk | grep -q 'lib/x86_64/libuniversal_reader_native.so'

  flutter-windows:
    name: Windows build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

  flutter-ios:
    name: iOS build
    runs-on: macos-14
    needs: native-ios
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Download iOS XCFramework
        uses: actions/download-artifact@v4
        with:
          name: universal-reader-native-ios
          path: rust/target/ios/UniversalReaderNative.xcframework

      - name: Verify iOS XCFramework
        working-directory: rust
        run: |
          test -f target/ios/UniversalReaderNative.xcframework/ios-arm64/libuniversal_reader_native.a
          test -f target/ios/UniversalReaderNative.xcframework/ios-arm64_x86_64-simulator/libuniversal_reader_native.a

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign

      - name: Verify iOS native symbols
        run: nm -gU build/ios/iphoneos/Runner.app/Runner | grep -q '_ur_chm_to_epub'
