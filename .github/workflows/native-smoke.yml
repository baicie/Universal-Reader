name: Native smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'

permissions:
  contents: read

concurrency:
  group: native-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android native smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Android native libraries
        working-directory: rust
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o target/android/jniLibs build -p universal-reader-mobile --release

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Run Android native smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd app && for attempt in 1 2; do echo "Android native smoke attempt ${attempt}"; if timeout 12m flutter test integration_test/native_format_converter_smoke_test.dart -d emulator-5554 --timeout=5m; then exit 0; fi; adb -s emulator-5554 logcat -d -t 400 > "android-smoke-attempt-${attempt}.log" || true; adb -s emulator-5554 shell input keyevent 82 || true; sleep 10; done; exit 1

      - name: Upload Android smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-smoke-diagnostics
          path: app/android-smoke-attempt-*.log
          if-no-files-found: ignore

  ios:
    name: iOS native smoke
    runs-on: macos-14
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build iOS XCFramework
        working-directory: rust
        run: bash tool/build-mobile-ios.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Boot iOS Simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; runtimes=json.load(sys.stdin)["devices"]; devices=[device for runtime in runtimes.values() for device in runtime if device.get("isAvailable") and device.get("name", "").startswith("iPhone")]; print(devices[0]["udid"])')
          test -n "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "IOS_SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run iOS native smoke
        run: flutter test integration_test/native_format_converter_smoke_test.dart -d "$IOS_SIMULATOR_UDID"
