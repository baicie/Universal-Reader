name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  web:
    name: Build Web release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify release
        run: |
          flutter analyze
          flutter test

      - name: Build Web
        run: flutter build web --release

      - name: Package Web
        shell: bash
        run: zip -r ../universal-reader-${{ env.RELEASE_TAG }}-web.zip build/web

      - name: Upload Web artifact
        uses: actions/upload-artifact@v7
        with:
          name: universal-reader-${{ env.RELEASE_TAG }}-web
          path: universal-reader-${{ env.RELEASE_TAG }}-web.zip
          if-no-files-found: error

  android:
    name: Build Android release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ contains(env.RELEASE_TAG, '-dev.') }}" == "true" && -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "Development release: building unsigned APKs with the Gradle debug signing key"
            exit 0
          fi

          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing required repository secret: $variable" >&2
              exit 1
            fi
          done

          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/universal-reader-release.jks
          {
            printf 'storeFile=universal-reader-release.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build Android universal APK
        run: flutter build apk --release

      - name: Build Android split APKs
        run: flutter build apk --release --split-per-abi

      - name: Package Android APKs
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ../universal-reader-${{ env.RELEASE_TAG }}-android.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../universal-reader-${{ env.RELEASE_TAG }}-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../universal-reader-${{ env.RELEASE_TAG }}-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk ../universal-reader-${{ env.RELEASE_TAG }}-android-x86_64.apk

      - name: Verify Android artifacts
        shell: bash
        run: |
          for apk in ../universal-reader-${{ env.RELEASE_TAG }}-android*.apk; do
            test -s "$apk"
            unzip -tq "$apk"
          done

      - name: Remove Android signing material
        if: always()
        shell: bash
        run: rm -f android/key.properties android/universal-reader-release.jks

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: universal-reader-${{ env.RELEASE_TAG }}-android
          path: universal-reader-${{ env.RELEASE_TAG }}-android-*.apk
          if-no-files-found: error

  windows:
    name: Build Windows release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Package Windows
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          $env:RELEASE_VERSION = "${{ env.RELEASE_TAG }}".TrimStart('v')
          $bundle = "build\windows\x64\runner\Release"
          Compress-Archive -Path "$bundle\*" -DestinationPath "..\universal-reader-${{ env.RELEASE_TAG }}-windows.zip"
          Compress-Archive -Path "$bundle\*" -DestinationPath "..\universal-reader-${{ env.RELEASE_TAG }}-windows-x86_64.zip"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DSourceDir=$((Resolve-Path $bundle).Path)" `
            windows\UniversalReader.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          Get-Item "..\universal-reader-${{ env.RELEASE_TAG }}-windows.zip"
          Get-Item "windows\universal-reader-${{ env.RELEASE_TAG }}-windows-x86_64-setup.exe"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: universal-reader-${{ env.RELEASE_TAG }}-windows
          path: |
            universal-reader-${{ env.RELEASE_TAG }}-windows.zip
            universal-reader-${{ env.RELEASE_TAG }}-windows-x86_64.zip
            windows/universal-reader-${{ env.RELEASE_TAG }}-windows-x86_64-setup.exe
          if-no-files-found: error

  linux:
    name: Build Linux desktop release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux
        shell: bash
        run: |
          bundle="build/linux/x64/release/bundle"
          tar -C "$bundle" -czf "$GITHUB_WORKSPACE/universal-reader-${{ env.RELEASE_TAG }}-linux.tar.gz" .
          tar -C "$bundle" -czf "$GITHUB_WORKSPACE/universal-reader-${{ env.RELEASE_TAG }}-linux-x86_64.tar.gz" .

      - name: Verify Linux artifacts
        shell: bash
        run: |
          for archive in "$GITHUB_WORKSPACE"/universal-reader-${{ env.RELEASE_TAG }}-linux*.tar.gz; do
            tar -tzf "$archive" | grep -q '^app$'
          done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: universal-reader-${{ env.RELEASE_TAG }}-linux
          path: universal-reader-${{ env.RELEASE_TAG }}-linux*.tar.gz
          if-no-files-found: error

  macos-native:
    name: Build macOS ${{ matrix.arch }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target_platform: darwin-arm64
            runner: macos-14
          - arch: x86_64
            target_platform: darwin-x64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS ${{ matrix.arch }}
        run: flutter build macos --release --target-platform=${{ matrix.target_platform }}

      - name: Package macOS ${{ matrix.arch }}
        shell: bash
        run: |
          bundle="build/macos/Build/Products/Release/app.app"
          tar -C "$(dirname "$bundle")" -czf "$GITHUB_WORKSPACE/universal-reader-${{ env.RELEASE_TAG }}-macos-${{ matrix.arch }}.tar.gz" "$(basename "$bundle")"
          hdiutil create -volname "Universal Reader ${{ matrix.arch }}" -srcfolder "$bundle" -ov -format UDZO "$GITHUB_WORKSPACE/universal-reader-${{ env.RELEASE_TAG }}-macos-${{ matrix.arch }}.dmg"

      - name: Verify macOS ${{ matrix.arch }} artifacts
        shell: bash
        run: |
          tar -tzf "$GITHUB_WORKSPACE/universal-reader-${{ env.RELEASE_TAG }}-macos-${{ matrix.arch }}.tar.gz" | grep -q '^app.app/$'
          hdiutil imageinfo "$GITHUB_WORKSPACE/universal-reader-${{ env.RELEASE_TAG }}-macos-${{ matrix.arch }}.dmg" >/dev/null

      - name: Upload macOS ${{ matrix.arch }} artifacts
        uses: actions/upload-artifact@v7
        with:
          name: universal-reader-${{ env.RELEASE_TAG }}-macos-${{ matrix.arch }}
          path: |
            universal-reader-${{ env.RELEASE_TAG }}-macos-${{ matrix.arch }}.tar.gz
            universal-reader-${{ env.RELEASE_TAG }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  macos-universal:
    name: Build macOS Universal installer
    needs: macos-native
    runs-on: macos-14
    steps:
      - name: Download native macOS bundles
        uses: actions/download-artifact@v8
        with:
          pattern: universal-reader-${{ env.RELEASE_TAG }}-macos-*
          path: artifacts
          merge-multiple: true

      - name: Create Universal app and DMG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arm64 x86_64 universal
          tar -xzf "artifacts/universal-reader-${{ env.RELEASE_TAG }}-macos-arm64.tar.gz" -C arm64
          tar -xzf "artifacts/universal-reader-${{ env.RELEASE_TAG }}-macos-x86_64.tar.gz" -C x86_64
          ditto arm64/app.app universal/app.app
          while IFS= read -r file; do
            relative="${file#universal/app.app/}"
            arm_file="arm64/app.app/$relative"
            x86_file="x86_64/app.app/$relative"
            if [[ -f "$arm_file" && -f "$x86_file" ]] && file "$arm_file" | grep -q 'Mach-O'; then
              lipo -create "$arm_file" "$x86_file" -output "$file"
            fi
          done < <(find universal/app.app -type f)
          ditto universal/app.app "universal-reader-${{ env.RELEASE_TAG }}-macos-universal.app"
          hdiutil create -volname "Universal Reader" -srcfolder universal/app.app -ov -format UDZO "universal-reader-${{ env.RELEASE_TAG }}-macos-universal.dmg"
          tar -C universal -czf "universal-reader-${{ env.RELEASE_TAG }}-macos-universal.tar.gz" app.app
          hdiutil imageinfo "universal-reader-${{ env.RELEASE_TAG }}-macos-universal.dmg" >/dev/null

      - name: Upload macOS Universal artifacts
        uses: actions/upload-artifact@v7
        with:
          name: universal-reader-${{ env.RELEASE_TAG }}-macos-universal
          path: |
            universal-reader-${{ env.RELEASE_TAG }}-macos-universal.tar.gz
            universal-reader-${{ env.RELEASE_TAG }}-macos-universal.dmg
          if-no-files-found: error

  server-linux:
    name: Build Rust server (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Verify Rust service
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Build Rust server
        run: cargo build --release --package universal-reader-server

      - name: Package Rust server
        shell: bash
        run: tar -C target/release -czf ../universal-reader-${{ env.RELEASE_TAG }}-server-linux-x86_64.tar.gz universal-reader-server

      - name: Upload Rust server artifact
        uses: actions/upload-artifact@v7
        with:
          name: universal-reader-${{ env.RELEASE_TAG }}-server-linux-x86_64
          path: universal-reader-${{ env.RELEASE_TAG }}-server-linux-x86_64.tar.gz
          if-no-files-found: error

  server-windows:
    name: Build Rust server (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Verify Rust service
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Build Rust server
        run: cargo build --release --package universal-reader-server

      - name: Package Rust server
        shell: pwsh
        run: Compress-Archive -Path target\release\universal-reader-server.exe -DestinationPath ..\universal-reader-${{ env.RELEASE_TAG }}-server-windows-x86_64.zip

      - name: Upload Rust server artifact
        uses: actions/upload-artifact@v7
        with:
          name: universal-reader-${{ env.RELEASE_TAG }}-server-windows-x86_64
          path: universal-reader-${{ env.RELEASE_TAG }}-server-windows-x86_64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [android, web, windows, linux, macos-native, macos-universal, server-linux, server-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: universal-reader-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.RELEASE_TAG }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "Universal Reader ${{ env.RELEASE_TAG }}" \
            --prerelease \
            --notes-file <(printf '%s\n' \
              '## Universal Reader ${{ env.RELEASE_TAG }}' \
              '' \
              '- Flutter Library / Reader / Settings MVP' \
              '- Local-first library persistence' \
              '- Rust local backend service with health and document format detection APIs' \
              '- Platform packages plus architecture packages for Android, Windows, Linux, and macOS; Windows includes x86_64 ZIP and EXE installer packages, while macOS includes Universal, arm64, and x86_64 DMG installers; Android also includes split ABI APKs (debug-signed for this development release)' \
              '- Reader Runtime adapter contracts for future Rust and native renderers')
