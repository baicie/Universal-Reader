name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0). Leave empty to use the latest pushed tag.'
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with EAS
        id: start
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@latest build \
            --platform android \
            --profile preview \
            --non-interactive \
            --json > build.json
          cat build.json
          BUILD_ID=$(node -e "const b=require('./build.json'); console.log(b[0]?.id || b.id)")
          echo "id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for build
        id: wait
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID="${{ steps.start.outputs.id }}"
          npx eas-cli@latest build:view "$BUILD_ID" --json > status.json
          STATUS=$(node -e "const s=require('./status.json'); console.log(s.status)")
          echo "Initial status: $STATUS"
          while [ "$STATUS" = "in_queue" ] || [ "$STATUS" = "building" ]; do
            sleep 60
            npx eas-cli@latest build:view "$BUILD_ID" --json > status.json
            STATUS=$(node -e "const s=require('./status.json'); console.log(s.status)")
            echo "Status: $STATUS"
          done
          if [ "$STATUS" != "finished" ]; then
            echo "Build ended in status: $STATUS"
            exit 1
          fi

      - name: Download artifact
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID="${{ steps.start.outputs.id }}"
          npx eas-cli@latest build:view "$BUILD_ID" --json > status.json
          ARTIFACT_URL=$(node -e "const s=require('./status.json'); console.log(s.artifacts?.buildUrl || s.artifacts?.applicationArchiveUrl || '')")
          if [ -z "$ARTIFACT_URL" ]; then
            echo "No artifact URL in build response"
            cat status.json
            exit 1
          fi
          echo "Downloading $ARTIFACT_URL"
          curl -L -o app.apk "$ARTIFACT_URL"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: mobile/app.apk
