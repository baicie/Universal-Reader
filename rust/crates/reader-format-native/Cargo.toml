[package]
name = "universal-reader-format-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared native CHM and DjVu conversion core."

[lib]
name = "reader_format_native"

[dependencies]
djvu-rs = { version = "0.32.1", features = ["cbz"] }
libchm = "0.3"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
